[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osmo-ble-ctrl"
version = "0.1.0"
description = "Small Windows BLE record controller for DJI Osmo Nano"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak==1.1.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
osmo-ble-ctrl = "osmo_ble_ctrl.app:main"

[tool.setuptools.packages.find]
include = ["osmo_ble_ctrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

